name: Feature request
description: Suggest an improvement to triage, reports, or the CLI.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        incopilot is read-only by design: it correlates and explains, it never restarts, deletes, or changes anything.
        Requests to auto-remediate will be closed — see [ROADMAP.md](https://github.com/AutoShiftOps/incopilot/blob/main/ROADMAP.md) ("Not planned").
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you trying to do during an incident, and where did incopilot fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
