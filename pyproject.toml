[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incopilot"
dynamic = ["version"]
description = "Read-only incident triage for logs: journalctl, Docker, Kubernetes and files, mapped to the Four Golden Signals."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AutoShiftOps" }]
keywords = ["incident-response", "sre", "logs", "triage", "observability", "kubernetes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.6", "bandit>=1.7", "build>=1.0"]

[project.urls]
Homepage = "https://incopilot.autoshiftops.com/"
Repository = "https://github.com/AutoShiftOps/incopilot"
Issues = "https://github.com/AutoShiftOps/incopilot/issues"

[project.scripts]
incopilot = "incopilot.cli:main"

[tool.setuptools]
packages = ["incopilot"]

[tool.setuptools.package-data]
incopilot = ["viewer.html"]

[tool.setuptools.dynamic]
version = { attr = "incopilot.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["incopilot"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]
"incopilot/collectors.py" = ["S404", "S603"]
"incopilot/patterns.py" = ["E501"]
