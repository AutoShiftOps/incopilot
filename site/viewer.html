<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>incopilot Report Viewer</title>
<meta name="description" content="Open an incopilot report.json and read it as a dashboard. Runs in your browser; nothing is uploaded.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
/* Layout: summary band (severity + four golden signals), then a signal-lane timeline,
   then findings and supporting detail in a two-column grid that stacks on phones. */
:root {
  --bg: #f2f5f7; --surface: #ffffff; --ink: #15202b; --muted: #55657a; --line: #d5dde5; --track: #e6ebf0;
  --accent: #0a6a70; --accent-ink: #ffffff; --bar: #2a78d6;
  --code-bg: #111a23; --code-fg: #dce6ee; --code-dim: #8499ab;
  --crit: #d03b3b; --high: #ec835a; --med: #fab219; --low: #6f8296; --ok: #0ca30c;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --surface: #17202a; --ink: #e5ecf2; --muted: #9aabbb; --line: #2a3643; --track: #222d39;
    --accent: #5fc6c4; --accent-ink: #0b1418; --bar: #3987e5;
    --code-bg: #0a0f14; --code-fg: #dce6ee; --code-dim: #7f93a5; --low: #8a9db0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #17202a; --ink: #e5ecf2; --muted: #9aabbb; --line: #2a3643; --track: #222d39;
  --accent: #5fc6c4; --accent-ink: #0b1418; --bar: #3987e5;
  --code-bg: #0a0f14; --code-fg: #dce6ee; --code-dim: #7f93a5; --low: #8a9db0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--body); margin: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 20px 48px; display: flex; flex-direction: column; gap: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2 { font-family: var(--display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.15rem; }
a { color: var(--accent); }
button, .filebtn { font: 500 0.85rem var(--body); border-radius: 6px; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, code, pre { font-family: var(--mono); }
.label { font: 500 0.72rem/1.2 var(--mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

.bar-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font: 500 1rem var(--mono); color: var(--ink); text-decoration: none; }
.brand span { color: var(--accent); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filebtn { background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border: 0; display: inline-block; }
.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 7px 12px; }
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 0.9rem; }
.notice.err { border-color: var(--crit); }
.drop { outline: 2px dashed var(--accent); outline-offset: 6px; }
#paste-box { display: flex; flex-direction: column; gap: 8px; }
#paste-text { width: 100%; min-height: 120px; font: 400 0.8rem var(--mono); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.summary { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 2fr); gap: 20px; }
.headline { display: flex; flex-direction: column; gap: 10px; }
.sevbig { display: flex; align-items: center; gap: 10px; font: 600 2rem/1 var(--display); text-transform: uppercase; }
.meta { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; font-size: 0.86rem; margin: 0; }
.meta dt { color: var(--muted); } .meta dd { margin: 0; overflow-wrap: anywhere; }
.signals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.signal { border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.signal strong { font: 600 1rem var(--body); text-transform: capitalize; }
.signal.quiet { opacity: 0.62; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font: 600 1.5rem/1.1 var(--body); }

/* severity: shape + color + word, never color alone */
.sev { display: inline-flex; align-items: center; gap: 6px; font-size: 0.86rem; white-space: nowrap; }
.glyph { width: 11px; height: 11px; flex: none; display: inline-block; }
.glyph.critical { background: var(--crit); transform: rotate(45deg); border-radius: 1px; }
.glyph.high { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 11px solid var(--high); }
.glyph.medium { background: var(--med); border-radius: 50%; }
.glyph.low { border: 2px solid var(--low); border-radius: 50%; }
.glyph.none { background: var(--ok); border-radius: 2px; }
.sevbig .glyph { transform-origin: center; scale: 1.5; margin-inline: 4px; }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

/* signal-lane timeline */
.lanes { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); row-gap: 0; }
.lane-name { font-size: 0.82rem; color: var(--muted); text-transform: capitalize; align-self: center; }
.lane { position: relative; height: 34px; border-top: 1px solid var(--track); margin-inline: 8px; }
.lane:last-of-type { border-bottom: 1px solid var(--track); }
.dot { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid var(--surface); padding: 0; cursor: pointer; }
.dot.critical { background: var(--crit); border-radius: 2px; transform: rotate(45deg); }
.dot.high { background: var(--high); } .dot.medium { background: var(--med); } .dot.low { background: var(--low); }
.dot::after { content: ""; position: absolute; inset: -9px; }
.axis { grid-column: 2; display: flex; justify-content: space-between; margin: 6px 8px 0; font: 400 0.72rem var(--mono); color: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; }
.order { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; }
.order li::marker { color: var(--muted); font-family: var(--mono); font-size: 0.8rem; }

/* findings: bar + table in one */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th { text-align: left; font: 500 0.72rem var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 0 10px 8px 0; white-space: nowrap; }
td { padding: 8px 10px 8px 0; border-top: 1px solid var(--line); vertical-align: middle; }
td.r, th.r { text-align: right; }
.barcell { min-width: 110px; width: 28%; }
.hbar { height: 10px; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.key { font: 400 0.75rem var(--mono); color: var(--muted); }
tr.hl td { background: color-mix(in srgb, var(--accent) 9%, transparent); }

.levels { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr) 3rem; gap: 8px 10px; align-items: center; font-size: 0.86rem; }
.levels .hbar { background: var(--low); }
.levels .hbar.hot { background: var(--bar); }
ul.plain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.steps li { padding-left: 14px; border-left: 2px solid var(--line); }
.cmd { display: flex; flex-direction: column; gap: 4px; }
.cmdline { display: flex; background: var(--code-bg); color: var(--code-fg); border-radius: 6px; overflow: hidden; }
.cmdline code { flex: 1; min-width: 0; padding: 8px 10px; font-size: 0.8rem; overflow-x: auto; white-space: nowrap; }
.cmdline button { background: transparent; color: var(--code-dim); border: 0; border-left: 1px solid #26333f; padding: 0 10px; font: 500 0.75rem var(--mono); }
.rep { display: grid; grid-template-columns: 2.6rem minmax(0, 1fr); gap: 8px; font-size: 0.8rem; }
.rep code { overflow-wrap: anywhere; }
details summary { cursor: pointer; font-weight: 500; }
details pre { margin: 8px 0 0; background: var(--code-bg); color: var(--code-fg); border-radius: 6px; padding: 10px; font-size: 0.78rem; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.ai { white-space: pre-wrap; }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 8px 10px; font-size: 0.8rem; max-width: 260px; line-height: 1.4; }
.foot { font-size: 0.82rem; color: var(--muted); }

@media (max-width: 860px) {
  .summary, .grid2 { grid-template-columns: minmax(0, 1fr); }
  .signals, .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>

<div class="wrap" id="app">
  <div class="bar-top">
    <a class="brand" href="https://github.com/AutoShiftOps/incopilot">in<span>copilot</span> <span class="muted">/ report viewer</span></a>
    <div class="actions">
      <label class="ghost" for="file-input" style="display:inline-block">Open a report.json</label>
      <input type="file" id="file-input" accept=".json,application/json" hidden>
      <button type="button" class="ghost" id="paste-toggle">Paste JSON</button>
      <button type="button" class="ghost" id="sample-btn" hidden>Show example</button>
    </div>
  </div>
  <div id="paste-box" hidden>
    <label class="label" for="paste-text">Paste the contents of report.json</label>
    <textarea id="paste-text" spellcheck="false"></textarea>
    <div class="actions"><button type="button" class="filebtn" id="paste-load">Load</button></div>
  </div>
  <div class="notice" id="notice" role="status"></div>
  <main id="report" class="col"></main>
  <p class="foot">You get this view locally by adding <code>--html</code> to any incopilot command; it writes a single <code>report.html</code> you can share. Opening a <code>report.json</code> here reads it in your browser and uploads nothing.</p>
</div>
<div class="tip" id="tip" hidden></div>

      stats.appendChild(h('div', { class: 'stat' }, h('span', { class: 'label', text: p[0] }), h('b', { class: 'num', text: fmt(p[1]) })));
    });
    var right = h('div', { class: 'col' }, h('div', {}, h('span', { class: 'label', text: 'Four Golden Signals' })), sig, stats);
    right.style.gap = '12px';
    var c = h('section', { class: 'card summary' }, head, right);
    if (st.truncated) c.appendChild(h('p', { class: 'muted', text: 'Input was larger than the size limit; only the most recent part was analyzed.' }));
    return c;
  }

  function timeline(d, byKey) {
    var order = (d.order_of_first_appearance || []).filter(function (k) { return byKey[k]; });
    if (!order.length) return null;
    var times = order.map(function (k) { return parseTs(byKey[k].first_seen); });
    var valid = times.filter(function (t) { return !isNaN(t); });
    var min = Math.min.apply(null, valid), max = Math.max.apply(null, valid);
    var c = card('Order of first appearance');
    c.appendChild(h('p', { class: 'muted', text: 'Earlier patterns are more likely causes. Later ones are often knock-on effects.' }));
    if (valid.length >= 2 && max > min) {
      var lanes = h('div', { class: 'lanes', role: 'img', 'aria-label': 'First appearance of each finding over time, by golden signal. The same data is listed below.' });
      SIGNALS.forEach(function (name) {
        var lane = h('div', { class: 'lane' });
        order.forEach(function (k, i) {
          var f = byKey[k];
          if (f.signal !== name || isNaN(times[i])) return;
          var b = h('button', { type: 'button', class: 'dot ' + sevOf(f.severity), 'aria-label': f.title + ', first seen ' + clock(f.first_seen) });
          b.style.left = ((times[i] - min) / (max - min) * 100).toFixed(2) + '%';
          tipOn(b, [f.title, 'First seen ' + clock(f.first_seen), sevOf(f.severity) + ' · ' + fmt(f.count) + (f.count === 1 ? ' line' : ' lines')]);
          b.addEventListener('click', function () { highlight(k); });
          lane.appendChild(b);
        });
        lanes.appendChild(h('div', { class: 'lane-name', text: name }));
        lanes.appendChild(lane);
      });
      var first = order[times.indexOf(min)], last = order[times.indexOf(max)];
      lanes.appendChild(h('div', { class: 'axis' }, h('span', { text: clock(byKey[first].first_seen) }), h('span', { text: clock(byKey[last].first_seen) })));
      c.appendChild(lanes);
      var lg = h('div', { class: 'legend' });
      ['critical', 'high', 'medium', 'low'].forEach(function (s) { lg.appendChild(sev(s)); });
      c.appendChild(lg);
    }
    var ol = h('ol', { class: 'order' });
    order.forEach(function (k) {
      var f = byKey[k];
      ol.appendChild(h('li', {}, h('span', { class: 'mono muted num', text: clock(f.first_seen) + '  ' }), f.title + ' ', h('span', { class: 'muted', text: '(' + f.signal + ')' })));
    });
    c.appendChild(ol);
    return c;
  }

  function highlight(key) {
    Array.prototype.forEach.call(document.querySelectorAll('tr[data-key]'), function (tr) {
      tr.classList.toggle('hl', tr.getAttribute('data-key') === key);
    });
    var row = document.querySelector('tr[data-key="' + (window.CSS && CSS.escape ? CSS.escape(key) : key) + '"]');
    if (row && row.scrollIntoView) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function findings(list) {
    var c = card('Findings');
    if (!list.length) { c.appendChild(h('p', { class: 'muted', text: 'No known failure pattern matched. Read the top repeating lines and start with host basics.' })); return c; }
    var max = Math.max.apply(null, list.map(function (f) { return f.count; }));
    var tb = h('tbody');
    list.forEach(function (f) {
      var bar = h('div', { class: 'hbar' });
      bar.style.width = Math.max(2, f.count / max * 100) + '%';
      var tr = h('tr', { 'data-key': f.key },
        h('td', {}, h('div', { text: f.title }), h('div', { class: 'key', text: f.key })),
        h('td', {}, sev(f.severity)),
        h('td', { text: f.signal }),
        h('td', { class: 'barcell' }, bar),
        h('td', { class: 'r num', text: fmt(f.count) }),
        h('td', { class: 'mono num', text: clock(f.first_seen) }),
        h('td', { class: 'mono num', text: clock(f.last_seen) }));
      tipOn(bar, [f.title, fmt(f.count) + (f.count === 1 ? ' matching line' : ' matching lines')]);
      tb.appendChild(tr);
    });
    var head = h('tr');
    [['Finding'], ['Severity'], ['Signal'], ['Lines'], ['', 'r'], ['First'], ['Last']].forEach(function (p) { head.appendChild(h('th', { class: p[1] || '', text: p[0] })); });
    c.appendChild(h('div', { class: 'scroll' }, h('table', {}, h('thead', {}, head), tb)));
    return c;
  }

  function levels(st) {
    var lv = st.levels || {}, keys = LEVELS.filter(function (k) { return lv[k]; });
    if (!keys.length) return null;
    var max = Math.max.apply(null, keys.map(function (k) { return lv[k]; }));
    var g = h('div', { class: 'levels' });
    keys.forEach(function (k) {
      var bar = h('div', { class: 'hbar' + (k === 'fatal' || k === 'error' ? ' hot' : '') });
      bar.style.width = Math.max(2, lv[k] / max * 100) + '%';
      g.appendChild(h('span', { text: k === 'unknown' ? 'no level' : k }));
      g.appendChild(bar);
      g.appendChild(h('span', { class: 'num', text: fmt(lv[k]) }));
    });
    var c = card('Log levels', g);
    if (st.first_timestamp) c.appendChild(h('p', { class: 'muted', text: 'Log time range: ' + st.first_timestamp + ' to ' + st.last_timestamp }));
    return c;
  }

  function copyBtn(text) {
    var b = h('button', { type: 'button', text: 'Copy' });
    b.addEventListener('click', function () {
      var ok = function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy'; }, 1400); };
      var sel = function () {
        var r = document.createRange(); r.selectNodeContents(b.previousSibling);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selected';
      };
      try { navigator.clipboard.writeText(text).then(ok, sel); } catch (e) { sel(); }
    });
    return b;
  }

  function render(d, isSample) {
    var root = $('report');
    root.textContent = '';
    var list = Object.keys(d.findings).map(function (k) {
      var f = d.findings[k] || {};
      return { key: k, title: String(f.title || k), signal: String(f.signal || 'errors'), severity: sevOf(f.severity),
               count: Number(f.count) || 0, first_seen: f.first_seen, last_seen: f.last_seen, examples: f.examples || [] };
    });
    var byKey = {};
    list.forEach(function (f) { byKey[f.key] = f; });

    root.appendChild(summary(d, list));
    var left = h('div', { class: 'col' }), right = h('div', { class: 'col' });
    [timeline(d, byKey), findings(list)].forEach(function (n) { if (n) left.appendChild(n); });

    if (d.ai) {
      var ai = card('AI hypothesis (unverified)');
      if (d.ai.hypothesis) {
        ai.appendChild(h('p', { class: 'muted', text: 'From ' + d.ai.provider + ' / ' + d.ai.model + ', built from the redacted summary. A lead to check, not a conclusion.' }));
        ai.appendChild(h('div', { class: 'ai', text: d.ai.hypothesis }));
      } else ai.appendChild(h('p', { class: 'muted', text: 'Not available: ' + d.ai.error }));
      right.appendChild(ai);
    }
    if ((d.suggestions || []).length) {
      var ul = h('ul', { class: 'plain steps' });
      d.suggestions.forEach(function (s) { ul.appendChild(h('li', { text: String(s) })); });
      right.appendChild(card('Suggested next steps', ul));
    }
    if ((d.safe_next_commands || []).length) {
      var cl = h('ul', { class: 'plain' });
      d.safe_next_commands.forEach(function (c) {
        cl.appendChild(h('li', { class: 'cmd' }, h('span', { text: String(c.title) }),
          h('div', { class: 'cmdline' }, h('code', { text: String(c.cmd) }), copyBtn(String(c.cmd)))));
      });
      right.appendChild(card('Read-only checks to run next', cl));
    }
    var lv = levels(d.stats);
    if (lv) right.appendChild(lv);
    root.appendChild(h('div', { class: 'grid2' }, left, right));

    if ((d.top_repeating_lines || []).length) {
      var reps = h('ul', { class: 'plain' });
      d.top_repeating_lines.forEach(function (r) {
        reps.appendChild(h('li', { class: 'rep' }, h('span', { class: 'num muted', text: fmt(r.count) + '×' }), h('code', { text: String(r.line) })));
      });
      root.appendChild(card('Top repeating lines (normalized)', reps));
    }
    var withEx = list.filter(function (f) { return f.examples.length; });
    if (withEx.length) {
      var ex = card('Examples (redacted)');
      withEx.forEach(function (f) {
        ex.appendChild(h('details', {}, h('summary', { text: f.title + ' (' + f.examples.length + ')' }), h('pre', { text: f.examples.join('\n') })));
      });
      root.appendChild(ex);
    }
    $('notice').className = 'notice';
    $('notice').textContent = isSample
      ? 'This is an example: the report incopilot produces for the bundled checkout incident. Get the same view for your own logs with: incopilot file --path app.log --html'
      : 'Showing ' + (d.meta.target || 'your report') + (d.meta.tool_version ? ', from incopilot ' + d.meta.tool_version : '') + '.';
    $('sample-btn').hidden = !!isSample || !sample;
  }

  function load(text) {
    var d;
    try { d = JSON.parse(text); } catch (e) { return fail('That file is not valid JSON.'); }
    var problem = validate(d);
    if (problem) return fail(problem);
    render(d, false);
    $('paste-box').hidden = true;
  }
  function fail(msg) { $('notice').className = 'notice err'; $('notice').textContent = msg; }
  function readFile(file) {
    if (!file) return;
    var r = new FileReader();
    r.onload = function () { load(String(r.result)); };
    r.onerror = function () { fail('Could not read that file.'); };
    r.readAsText(file);
  }

  var sample = null, embedded = null;
  try { sample = JSON.parse($('sample-data').textContent); } catch (e) { sample = null; }
  try { embedded = JSON.parse($('report-data').textContent); } catch (e) { embedded = null; }

  $('file-input').addEventListener('change', function (e) { readFile(e.target.files[0]); e.target.value = ''; });
  $('paste-toggle').addEventListener('click', function () { $('paste-box').hidden = !$('paste-box').hidden; });
  $('paste-load').addEventListener('click', function () { load($('paste-text').value); });
  $('sample-btn').addEventListener('click', function () { if (sample) render(sample, true); });
  var app = $('app');
  ['dragenter', 'dragover'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); app.classList.add('drop'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); app.classList.remove('drop'); }); });
  document.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files.length) readFile(e.dataTransfer.files[0]); });
  window.addEventListener('scroll', hideTip, true);

  if (embedded && !validate(embedded)) render(embedded, false);
  else if (sample && !validate(sample)) render(sample, true);
  else fail('Open a report.json file to begin.');
})();
</script>
